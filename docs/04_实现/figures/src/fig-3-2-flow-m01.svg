<svg xmlns="http://www.w3.org/2000/svg" width="760" height="632" viewBox="0 0 760 632">
<rect width="760" height="632" fill="#ffffff"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/></marker></defs>
<rect x="180.0" y="24" width="240" height="46" rx="6" fill="#f1f5f9" stroke="#334155" stroke-width="1.3"/>
<text x="300.0" y="52.0" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="12" fill="#1f2937" text-anchor="middle">开始：收到登录请求</text>
<path d="M 300.0 70.0 L 300.0 98.0" stroke="#334155" stroke-width="1.3" marker-end="url(#a)"/>
<path d="M 300.0 100.0 L 420.0 130.0 L 300.0 160.0 L 180.0 130.0 Z" fill="#f8fafc" stroke="#334155" stroke-width="1.3"/>
<text x="300.0" y="135.0" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="12" fill="#1f2937" text-anchor="middle">账号存在？</text>
<path d="M 420.0 130.0 L 500 130.0" stroke="#334155" stroke-width="1.2" marker-end="url(#a)"/>
<text x="430.0" y="124.0" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">否</text>
<rect x="510" y="103.0" width="230" height="54" rx="5" fill="#ffffff" stroke="#334155" stroke-width="1.2"/>
<text x="625.0" y="119.0" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="10" fill="#1f2937" text-anchor="middle">统一返回 401</text>
<text x="625.0" y="137.0" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="10" fill="#1f2937" text-anchor="middle">不区分账号是否存在</text>
<path d="M 300.0 160.0 L 300.0 188.0" stroke="#334155" stroke-width="1.3" marker-end="url(#a)"/>
<text x="314.0" y="179.0" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">是</text>
<path d="M 300.0 190.0 L 420.0 220.0 L 300.0 250.0 L 180.0 220.0 Z" fill="#f8fafc" stroke="#334155" stroke-width="1.3"/>
<text x="300.0" y="225.0" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="12" fill="#1f2937" text-anchor="middle">处于锁定期？</text>
<path d="M 420.0 220.0 L 500 220.0" stroke="#334155" stroke-width="1.2" marker-end="url(#a)"/>
<text x="430.0" y="214.0" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">是</text>
<rect x="510" y="193.0" width="230" height="54" rx="5" fill="#ffffff" stroke="#334155" stroke-width="1.2"/>
<text x="625.0" y="209.0" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="10" fill="#1f2937" text-anchor="middle">返回 401 + 剩余时间</text>
<text x="625.0" y="227.0" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="10" fill="#1f2937" text-anchor="middle">正确口令也不放行</text>
<path d="M 300.0 250.0 L 300.0 278.0" stroke="#334155" stroke-width="1.3" marker-end="url(#a)"/>
<text x="314.0" y="269.0" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">否</text>
<path d="M 300.0 280.0 L 420.0 310.0 L 300.0 340.0 L 180.0 310.0 Z" fill="#f8fafc" stroke="#334155" stroke-width="1.3"/>
<text x="300.0" y="315.0" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="12" fill="#1f2937" text-anchor="middle">口令散列比对通过？</text>
<path d="M 420.0 310.0 L 500 310.0" stroke="#334155" stroke-width="1.2" marker-end="url(#a)"/>
<text x="430.0" y="304.0" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">否</text>
<rect x="510" y="283.0" width="230" height="54" rx="5" fill="#ffffff" stroke="#334155" stroke-width="1.2"/>
<text x="625.0" y="299.0" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="10" fill="#1f2937" text-anchor="middle">失败计数 +1</text>
<text x="625.0" y="317.0" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="10" fill="#1f2937" text-anchor="middle">满 5 次置锁定 5 分钟</text>
<path d="M 300.0 340.0 L 300.0 368.0" stroke="#334155" stroke-width="1.3" marker-end="url(#a)"/>
<text x="314.0" y="359.0" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">是</text>
<rect x="180.0" y="370" width="240" height="68" rx="6" fill="#ffffff" stroke="#334155" stroke-width="1.3"/>
<text x="300.0" y="400.5" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="12" fill="#1f2937" text-anchor="middle">失败计数清零</text>
<text x="300.0" y="417.5" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="12" fill="#1f2937" text-anchor="middle">签发令牌（含角色，24 小时）</text>
<path d="M 300.0 438.0 L 300.0 466.0" stroke="#334155" stroke-width="1.3" marker-end="url(#a)"/>
<rect x="180.0" y="468" width="240" height="46" rx="6" fill="#ffffff" stroke="#334155" stroke-width="1.3"/>
<text x="300.0" y="496.0" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="12" fill="#1f2937" text-anchor="middle">记录最近登录时间</text>
<path d="M 300.0 514.0 L 300.0 542.0" stroke="#334155" stroke-width="1.3" marker-end="url(#a)"/>
<rect x="180.0" y="544" width="240" height="46" rx="6" fill="#f1f5f9" stroke="#334155" stroke-width="1.3"/>
<text x="300.0" y="572.0" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="12" fill="#1f2937" text-anchor="middle">结束：返回令牌与角色</text>
</svg>
