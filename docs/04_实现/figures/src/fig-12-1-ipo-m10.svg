<text x="678.0" y="102.0" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="12" fill="#1f2937" text-anchor="start">· 错误对象 code / message / field </text>
<text x="678.0" y="126.0" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="12" fill="#1f2937" text-anchor="start">  / request_id</text>
<text x="678.0" y="150.0" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="12" fill="#1f2937" text-anchor="start">· 幂等键透传结果</text>
