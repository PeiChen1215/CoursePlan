<text x="356.0" y="150.0" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="12" fill="#1f2937" text-anchor="start">· 异常到错误码映射</text>
<text x="356.0" y="174.0" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="12" fill="#1f2937" text-anchor="start">· 统一响应包装</text>
