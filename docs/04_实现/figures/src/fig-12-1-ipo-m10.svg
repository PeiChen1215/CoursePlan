<text x="494.0" y="43.0" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="bold">处理</text>
<text x="356.0" y="78.0" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="12" fill="#1f2937" text-anchor="start">· 鉴权与角色判定</text>
<text x="356.0" y="102.0" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="12" fill="#1f2937" text-anchor="start">· 路径参数与 DTO 校验</text>
