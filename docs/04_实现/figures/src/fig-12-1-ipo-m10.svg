<text x="34.0" y="78.0" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="12" fill="#1f2937" text-anchor="start">· HTTP 请求：方法、路径、头、体</text>
<text x="34.0" y="102.0" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="12" fill="#1f2937" text-anchor="start">· 路由表（与 D04 表 3.3 对应）</text>
<text x="34.0" y="126.0" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="12" fill="#1f2937" text-anchor="start">· 领域程序返回结果或异常</text>
<rect x="344" y="20" width="300" height="178" rx="6" fill="#f8fafc" stroke="#334155" stroke-width="1.3"/>
