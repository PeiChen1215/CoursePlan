<svg xmlns="http://www.w3.org/2000/svg" width="988" height="266" viewBox="0 0 988 266">
<rect width="988" height="266" fill="#ffffff"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/></marker></defs>
<rect x="22" y="20" width="300" height="226" rx="6" fill="#ffffff" stroke="#334155" stroke-width="1.3"/>
<rect x="22" y="20" width="300" height="34" rx="6" fill="#f1f5f9" stroke="#334155" stroke-width="1.1"/>
<text x="172.0" y="43.0" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="bold">输入</text>
<text x="34.0" y="78.0" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="12" fill="#1f2937" text-anchor="start">· 约束对象：主目标、附加目标、截止、</text>
<text x="34.0" y="102.0" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="12" fill="#1f2937" text-anchor="start">  周模板、排除日期、已掌握</text>
<text x="34.0" y="126.0" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="12" fill="#1f2937" text-anchor="start">· 课程内容快照：知识点、参考时长、先</text>
<text x="34.0" y="150.0" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="12" fill="#1f2937" text-anchor="start">  修边、资源</text>
<text x="34.0" y="174.0" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="12" fill="#1f2937" text-anchor="start">· 配置：学习练习比 7:3、缓冲比例 10%</text>
<text x="34.0" y="198.0" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="12" fill="#1f2937" text-anchor="start">  、片长上限、片数上限</text>
<text x="34.0" y="222.0" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="12" fill="#1f2937" text-anchor="start">· 基准时刻 base_time（UTC）</text>
<rect x="344" y="20" width="300" height="226" rx="6" fill="#f8fafc" stroke="#334155" stroke-width="1.3"/>
<rect x="344" y="20" width="300" height="34" rx="6" fill="#f1f5f9" stroke="#334155" stroke-width="1.1"/>
<text x="494.0" y="43.0" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="bold">处理</text>
<text x="356.0" y="78.0" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="12" fill="#1f2937" text-anchor="start">· 求先修闭包并剔除已掌握</text>
<text x="356.0" y="102.0" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="12" fill="#1f2937" text-anchor="start">· 按参考时长拆学习/练习任务</text>
<text x="356.0" y="126.0" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="12" fill="#1f2937" text-anchor="start">· 拓扑排序（先修 + 学习先于练习）</text>
<text x="356.0" y="150.0" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="12" fill="#1f2937" text-anchor="start">· 按可用时段逐段装箱，留缓冲</text>
<text x="356.0" y="174.0" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="12" fill="#1f2937" text-anchor="start">· 超长任务拆片，片数和片长受限</text>
<text x="356.0" y="198.0" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="12" fill="#1f2937" text-anchor="start">· 汇总 T / C / B / C′ 与缺口</text>
<rect x="666" y="20" width="300" height="226" rx="6" fill="#ffffff" stroke="#334155" stroke-width="1.3"/>
<rect x="666" y="20" width="300" height="34" rx="6" fill="#f1f5f9" stroke="#334155" stroke-width="1.1"/>
<text x="816.0" y="43.0" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="bold">输出</text>
<text x="678.0" y="78.0" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="12" fill="#1f2937" text-anchor="start">· 任务列表（稳定身份 + 预计时长）</text>
<text x="678.0" y="102.0" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="12" fill="#1f2937" text-anchor="start">· 时间片列表（起止、所属版本）</text>
<text x="678.0" y="126.0" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="12" fill="#1f2937" text-anchor="start">· 未排入清单与原因</text>
<text x="678.0" y="150.0" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="12" fill="#1f2937" text-anchor="start">· 指标：T、C、B、C′、缺口、利用率</text>
<text x="678.0" y="174.0" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="12" fill="#1f2937" text-anchor="start">· 草案对象（含输入快照引用）</text>
