<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1070" viewBox="0 0 1200 1070">
<rect width="100%" height="100%" fill="white"/>
<text x="600.0" y="35" dominant-baseline="middle" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="30">图3  计划校验 N-S 图（结构化盒图）</text>
<rect x="80" y="85" width="1040" height="75" rx="0" fill="#f3f6f9" stroke="#273444" stroke-width="2"/>
<text x="600.0" y="122.5" dominant-baseline="middle" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="26">检查输入结构、时间格式与引用完整性</text>
<rect x="80" y="160" width="1040" height="250" rx="0" fill="white" stroke="#273444" stroke-width="2"/>
<polyline points="80,160 600,240 1120,160" fill="none" stroke="#273444" stroke-width="2"/>
<text x="600" y="188" dominant-baseline="middle" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="25">输入结构有效？</text>
<text x="160" y="220" dominant-baseline="middle" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="23">否</text>
<text x="1040" y="220" dominant-baseline="middle" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="23">是</text>
<polyline points="600,240 600,410" fill="none" stroke="#273444" stroke-width="2"/>
<text x="340" y="305" dominant-baseline="middle" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="25">记录结构错误</text>
<text x="340" y="339" dominant-baseline="middle" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="25">不执行依赖该结构的检查</text>
<text x="850" y="285" dominant-baseline="middle" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="24">依次检查：容量、重叠、先修、截止</text>
<text x="850" y="318" dominant-baseline="middle" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="24">收集全部业务错误，不短路</text>
<rect x="80" y="410" width="1040" height="90" rx="0" fill="#f3f6f9" stroke="#273444" stroke-width="2"/>
<text x="600.0" y="455.0" dominant-baseline="middle" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="26">遍历所有可解析任务 / 切片 / 先修边</text>
<rect x="80" y="500" width="75" height="280" rx="0" fill="#e8edf3" stroke="#273444" stroke-width="2"/>
<rect x="155" y="500" width="965" height="75" rx="0" fill="#f3f6f9" stroke="#273444" stroke-width="2"/>
<text x="637.5" y="537.5" dominant-baseline="middle" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="25">执行当前条目检查；追加错误及定位信息</text>
<rect x="155" y="575" width="965" height="205" rx="0" fill="white" stroke="#273444" stroke-width="2"/>
<polyline points="155,575 640,650 1120,575" fill="none" stroke="#273444" stroke-width="2"/>
<text x="640" y="602" dominant-baseline="middle" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="25">发现异常？</text>
<text x="230" y="635" dominant-baseline="middle" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="22">是</text>
<text x="1040" y="635" dominant-baseline="middle" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="22">否</text>
<polyline points="640,650 640,780" fill="none" stroke="#273444" stroke-width="2"/>
<text x="395" y="710" dominant-baseline="middle" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="23">记录错误码、任务及切片位置</text>
<text x="880" y="710" dominant-baseline="middle" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="24">继续下一条目</text>
<rect x="80" y="780" width="1040" height="85" rx="0" fill="#f3f6f9" stroke="#273444" stroke-width="2"/>
<text x="600.0" y="822.5" dominant-baseline="middle" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="25">去重并稳定排序 issues；计算容量、负载和未排分钟</text>
<rect x="80" y="865" width="1040" height="100" rx="0" fill="#f3f6f9" stroke="#273444" stroke-width="2"/>
<text x="600.0" y="898.0" dominant-baseline="middle" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="25">输出 ValidationReport：passed = 不含 ERROR</text>
<text x="600.0" y="932.0" dominant-baseline="middle" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="25">WARN 可确认，ERROR 不可确认</text>
<text x="600" y="1010" dominant-baseline="middle" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="22">说明：外框为顺序结构；窄侧栏与条件行构成遍历结构。</text>
</svg>