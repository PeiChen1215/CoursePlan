<polyline points="633.4755169883315,1266.49329346471 640,1280 646.5244830116685,1266.49329346471" fill="none" stroke="#273444" stroke-width="2"/>
<text x="680" y="752" dominant-baseline="middle" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="22">是</text>
<polyline points="440,660 120,660 120,1165 330,1165" fill="none" stroke="#273444" stroke-width="2"/>
<polyline points="316.49329346470984,1171.5244830116685 330,1165 316.49329346470984,1158.4755169883315" fill="none" stroke="#273444" stroke-width="2"/>
