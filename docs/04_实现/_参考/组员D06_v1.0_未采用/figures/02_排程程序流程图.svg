<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="1420" viewBox="0 0 1300 1420">
<rect width="100%" height="100%" fill="white"/>
<text x="650.0" y="35" dominant-baseline="middle" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="30">图2  确定性排程程序流程图</text>
<rect x="420" y="80" width="440" height="65" rx="10" fill="#f3f6f9" stroke="#273444" stroke-width="2"/>
<text x="640.0" y="112.5" dominant-baseline="middle" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="26">开始</text>
<rect x="330" y="180" width="620" height="90" rx="0" fill="#f3f6f9" stroke="#273444" stroke-width="2"/>
<text x="640.0" y="225.0" dominant-baseline="middle" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="26">读取快照、基准时间及固定配置</text>
<rect x="330" y="310" width="620" height="100" rx="0" fill="#f3f6f9" stroke="#273444" stroke-width="2"/>
<text x="640.0" y="342.5" dominant-baseline="middle" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="26">补齐目标先修闭包；稳定拓扑排序</text>
<text x="640.0" y="377.5" dominant-baseline="middle" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="26">拆成学习 / 练习逻辑任务</text>
<rect x="330" y="450" width="620" height="95" rx="0" fill="#f3f6f9" stroke="#273444" stroke-width="2"/>
<text x="640.0" y="480.0" dominant-baseline="middle" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="26">展开有效时段；扣除各段尾部缓冲</text>
<text x="640.0" y="515.0" dominant-baseline="middle" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="26">保留已完成任务，装入待排任务</text>
<polygon points="640.0,590 840,660.0 640.0,730 440,660.0" fill="#f3f6f9" stroke="#273444" stroke-width="2"/>
<text x="640.0" y="660.0" dominant-baseline="middle" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="26">还有待排任务？</text>
<rect x="330" y="780" width="620" height="85" rx="0" fill="#f3f6f9" stroke="#273444" stroke-width="2"/>
<text x="640.0" y="805.0" dominant-baseline="middle" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="26">求满足先修的最早可用分钟</text>
<text x="640.0" y="840.0" dominant-baseline="middle" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="26">按 ≤120 分钟切片</text>
<rect x="330" y="920" width="620" height="140" rx="0" fill="#f3f6f9" stroke="#273444" stroke-width="2"/>
<text x="640.0" y="972.5" dominant-baseline="middle" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="26">记录已排切片及剩余分钟</text>
<text x="640.0" y="1007.5" dominant-baseline="middle" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="26">取下一任务；先修不满足则全部未排</text>
<rect x="330" y="1120" width="620" height="90" rx="0" fill="#f3f6f9" stroke="#273444" stroke-width="2"/>
<text x="640.0" y="1147.5" dominant-baseline="middle" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="26">合并已排 / 未排任务；执行完整校验</text>
<text x="640.0" y="1182.5" dominant-baseline="middle" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="26">生成草案、错误列表及输入摘要</text>
<rect x="420" y="1280" width="440" height="65" rx="10" fill="#f3f6f9" stroke="#273444" stroke-width="2"/>
<text x="640.0" y="1312.5" dominant-baseline="middle" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="26">返回草案（不直接生效）</text>
