<text x="1150" y="850" dominant-baseline="middle" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="22">继续遍历</text>
<text x="640" y="1085" dominant-baseline="middle" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="22">所有任务遍历完毕后统一校验</text>
