<svg xmlns="http://www.w3.org/2000/svg" width="1420" height="860" viewBox="0 0 1420 860">
<rect width="100%" height="100%" fill="white"/>
<text x="710.0" y="35" dominant-baseline="middle" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="30">图4  登录处理 PAD 图</text>
<polyline points="80,100 80,740" fill="none" stroke="#273444" stroke-width="2"/>
<rect x="80" y="110" width="480" height="75" rx="0" fill="#f3f6f9" stroke="#273444" stroke-width="2"/>
<text x="320.0" y="147.5" dominant-baseline="middle" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="25">校验用户名 / 密码输入格式</text>
<rect x="80" y="225" width="480" height="75" rx="0" fill="#f3f6f9" stroke="#273444" stroke-width="2"/>
<text x="320.0" y="262.5" dominant-baseline="middle" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="24">读取账户；未知账户做等价哈希校验</text>
<polyline points="80,360 480,360 445,405 480,450 80,450" fill="none" stroke="#273444" stroke-width="2"/>
<text x="275" y="400" dominant-baseline="middle" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="24">账户可登录且密码匹配？</text>
<polyline points="480,360 650,360" fill="none" stroke="#273444" stroke-width="2"/>
<text x="590" y="335" dominant-baseline="middle" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="22">是</text>
<rect x="650" y="325" width="680" height="75" rx="0" fill="#f3f6f9" stroke="#273444" stroke-width="2"/>
<text x="990.0" y="362.5" dominant-baseline="middle" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="25">清零失败次数；签发 24 小时会话</text>
<polyline points="480,450 650,450" fill="none" stroke="#273444" stroke-width="2"/>
<text x="590" y="430" dominant-baseline="middle" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="22">否</text>
<rect x="650" y="415" width="680" height="75" rx="0" fill="#f3f6f9" stroke="#273444" stroke-width="2"/>
<text x="990.0" y="452.5" dominant-baseline="middle" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="23">认证失败；仅可计数账户累计失败次数</text>
<polyline points="650,490 650,670" fill="none" stroke="#273444" stroke-width="2"/>
<polyline points="650,550 980,550 950,590 980,630 650,630" fill="none" stroke="#273444" stroke-width="2"/>
<text x="805" y="586" dominant-baseline="middle" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="22">本次达到第 5 次失败？</text>
<polyline points="980,550 1050,550" fill="none" stroke="#273444" stroke-width="2"/>
<text x="1015" y="528" dominant-baseline="middle" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="20">是</text>
<rect x="1050" y="520" width="310" height="65" rx="0" fill="#f3f6f9" stroke="#273444" stroke-width="2"/>
<text x="1205.0" y="552.5" dominant-baseline="middle" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="20">锁定至基准时间 +5 分钟</text>
<polyline points="980,630 1050,630" fill="none" stroke="#273444" stroke-width="2"/>
<text x="1015" y="608" dominant-baseline="middle" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="20">否</text>
<rect x="1050" y="600" width="310" height="65" rx="0" fill="#f3f6f9" stroke="#273444" stroke-width="2"/>
<text x="1205.0" y="632.5" dominant-baseline="middle" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="22">保留失败计数</text>
<rect x="80" y="700" width="480" height="65" rx="0" fill="#f3f6f9" stroke="#273444" stroke-width="2"/>
<text x="320.0" y="732.5" dominant-baseline="middle" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="24">提交认证状态；返回结果</text>
<text x="720" y="815" dominant-baseline="middle" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="23">顺序沿左侧竖线自上而下；选择分支向右展开，无流程箭头。</text>
</svg>